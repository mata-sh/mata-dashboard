services:
  mata-web:
    # Use development Dockerfile
    build:
      context: .
      dockerfile: Dockerfile.dev

    # Mount entire source code for hot reload
    volumes:
      - .:/var/www/html:cached
      # Override vendor to avoid permission issues
      - /var/www/html/vendor

    # Development environment overrides
    # Most settings come from config/config.env - these are dev-specific runtime overrides
    environment:
      # Optional: Xdebug settings (uncomment if Xdebug is enabled in Dockerfile.dev)
      # - XDEBUG_MODE=debug
      # - XDEBUG_CONFIG=client_host=host.docker.internal

    # Keep Apache running (not built-in server)
    # Apache config already set up for document root at /var/www/html/public

    # Port mapping (Apache on port 80 inside container)
    ports:
      - "${WEB_PORT:-8080}:80"

    # Development health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mata-db:
    # Use tmpfs for faster database operations in development
    # Override volumes to remove persistent mysql_data volume
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      # Note: /var/lib/mysql is mounted as tmpfs (see below) instead of persistent volume
    tmpfs:
      - /var/lib/mysql

    # Development MySQL settings (more verbose logging)
    environment:
      - MYSQL_GENERAL_LOG=1
      - MYSQL_GENERAL_LOG_FILE=/var/lib/mysql/general.log