site_name: MATA Dashboard
site_description: Enterprise-grade server monitoring solution
repo_url: https://github.com/mata-sh/mata-dashboard
edit_uri: edit/main/docs/

theme:
  name: shadcn
  features:
    - navigation.sections
    - navigation.tabs
    - content.code.copy
    - content.action.edit
    - toc.follow
  icon: images/logo_transparent.png
  show_stargazers: false
  pygments: true

nav:
  - MATA: index.md

  - Getting Started:
      - Quick Start: guides/quickstart.md
      - First Server: tutorials/first-server.md
      - Configuration: guides/configuration.md

  - Guides:
      - Docker Deployment: guides/quickstart-docker.md
      - User Management CLI: guides/user-management.md
      # - First Server: guides/first-server.md
      - Securing Application: guides/secure-application.md
      - Monitoring:
          - Overview: guides/monitoring.md
          - Application Error Monitoring: guides/application-error-monitoring.md
#     - Deployment: guides/deployment.md

  - Reference:
      - Alarm Decision and Delivery Flow: drafts/reference/alarms.md

  - Architecture:
    - Security: architecture/security.md
    - Overview: architecture/overview.md
    - Server Metrics Pipeline: architecture/server-metrics-pipeline.md
  #   - Components: architecture/components.md
  #   - Technology Choices: architecture/technology-choices.md
  #   - Security Model: architecture/security-model.md

  - Development:
      - Setup Development: development/development-setup.md
#     - Contributing: development/contributing.md
#     - Project Structure: development/project-structure.md
#     - Code Quality: development/code-quality.md
#     - Cron Jobs: development/cron-jobs.md
#     - Testing: development/testing.md
#     - Docker Fixes: development/buildx-setup.md

# - Tutorials:
#     - Custom Thresholds: tutorials/custom-thresholds.md
# - Troubleshooting: tutorials/troubleshooting.md


extra_css:
  - styles/pygments-dark.css

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.highlight:
      use_pygments: true
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - toc:
      permalink: false
