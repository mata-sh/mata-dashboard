site_name: MATA Dashboard
site_description: Lightweight PHP monitoring dashboard for servers and applications
site_url: https://docs.mata.sh/
repo_url: https://github.com/mata-sh/mata-dashboard
edit_uri: edit/main/docs/

# Implementation plans and unfinished drafts stay in the repository but are not
# published. Without this, MkDocs builds them into the site regardless of nav.
exclude_docs: |
  plans/**
  drafts/**

theme:
  name: shadcn
  features:
    - navigation.sections
    - navigation.tabs
    - content.code.copy
    - content.action.edit
    - toc.follow
  icon: images/logo_transparent.png
  show_stargazers: false
  pygments: true

nav:
  - MATA: index.md

  - Getting started:
      - Quick start: guides/quickstart.md
      - Docker quickstart: guides/quickstart-docker.md
      - Add your first server: guides/first-server.md
      - Install with a coding agent: guides/agent-install.md

  - Guides:
      - Configuration: guides/configuration.md
      - Version your config: guides/version-config.md
      - Monitoring: guides/monitoring.md
      - Application error monitoring: guides/application-error-monitoring.md
      - Security advisories: guides/security-advisories.md
      - User management CLI: guides/user-management.md
      - Secure an installation: guides/secure-application.md
      - Web server examples: examples/webserver-configs/README.md

  # Synced from mata-node by scripts/docs/sync-node-docs.sh
  - Node:
      - Configuration: node/configuration.md
      - Command line: node/cli.md
      - Framework detection: node/frameworks.md
      - Docker: node/docker.md
      - Log formats: node/log-parsers.md
      - Shell command surface: node/shell-command-surface.md

  - Reference:
      - Alarm decision and delivery flow: reference/alarms.md
      - Docker deployment: reference/docker.md
      - Operator CLI: reference/cli.md

  - Architecture:
      - Overview: architecture/overview.md
      - Security: architecture/security.md
      - Server metrics pipeline: architecture/server-metrics-pipeline.md
      - Technology choices: architecture/technology-choices.md

  - Development:
      - Development setup: development/development-setup.md
      - Documentation: development/documentation.md
      - UI style guide: development/ui-styleguide.md
      - Changelog: development/changelog.md

extra_css:
  - styles/pygments-dark.css

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.highlight:
      use_pygments: true
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - toc:
      permalink: false

plugins:
  - search
  # Publishes /llms.txt, /llms-full.txt and a Markdown copy of each listed page for agents.
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >
        MATA is a self-hosted PHP dashboard that monitors servers and applications through
        MATA Node agents. Coding agents installing it start with the agent runbook; every
        operator command (bin/mata) prints JSON with --json and reports through its exit code.
      sections:
        Getting started:
          - guides/agent-install.md: Runbook for coding agents, non-interactive install and checks
          - guides/quickstart-docker.md: Docker install, unattended setup variables
          - guides/quickstart.md: Native install
          - guides/first-server.md: Connect a MATA Node
        Guides:
          - guides/configuration.md
          - guides/version-config.md
          - guides/monitoring.md
          - guides/application-error-monitoring.md
          - guides/user-management.md
          - guides/secure-application.md
        Reference:
          - reference/*.md
          - node/*.md
        Optional:
          - architecture/*.md
