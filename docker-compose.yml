services:
  mata-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
        COMPOSER_VERSION: ${COMPOSER_VERSION:-2.7.9}
    # Note: container_name prevents scaling (docker compose up --scale)
    # Remove if you need multiple replicas or orchestration
    container_name: ${COMPOSE_PROJECT_NAME:-mata-dashboard}-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3300}:80"
    volumes:
      - ./config:/var/www/html/config
      - ./logs:/var/www/html/logs
      - ./temp:/var/www/html/temp
      - mata_users:/var/lib/mata-dashboard
    env_file:
      - ./config/config.env
      - ./config/db.config.env
      - ./config/mail.config.env
    environment:
      # Override only Docker-specific infrastructure settings
      # Application settings come from config/*.env files
      - DB_HOST=mata-db
      # Docker always stores credentials on this persistent named volume.
      - MATA_USERS_FILE=/var/lib/mata-dashboard/users.json
    depends_on:
      mata-db:
        condition: service_healthy
      mata-opa:
        condition: service_started
    networks:
      - mata-network
  mata-db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-mata}-mysql
    restart: unless-stopped
    env_file:
      - ./config/db.config.env
    environment:
      # MySQL container initialization. These DB_* values come from config/db.config.env,
      # which reaches interpolation only because every invocation passes it explicitly:
      # --env-file config/db.config.env --env-file .env (Makefile:22). The env_file above
      # cannot supply them - it injects into the container at runtime, while ${VAR} is
      # resolved at parse time. A bare `docker compose up` therefore fails on the
      # required values below rather than silently initializing a weak default.
      # Development alone mounts docker/mysql/init.sql via docker-compose.dev.yml; production does not.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?missing - run via make, or pass --env-file config/db.config.env --env-file .env}
      MYSQL_DATABASE: ${DB_DATABASE:-mata_dashboard}
      MYSQL_USER: ${DB_USERNAME:-mata_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?missing - run via make, or pass --env-file config/db.config.env --env-file .env}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - mata-network

  mata-opa:
    image: openpolicyagent/opa:1.19.1
    container_name: ${COMPOSE_PROJECT_NAME:-mata}-opa
    restart: unless-stopped
    command: ["run", "--server", "--addr", "0.0.0.0:3320", "--watch", "/policies"]
    volumes:
      - ./policy:/policies:ro
    networks:
      - mata-network

volumes:
  mysql_data:
    driver: local
  mata_users:
    driver: local

networks:
  mata-network:
    name: mata-network
    external: true
