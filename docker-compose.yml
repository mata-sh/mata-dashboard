services:
  mata-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3.14}
        COMPOSER_VERSION: ${COMPOSER_VERSION:-2.7.9}
    # Note: container_name prevents scaling (docker-compose up --scale)
    # Remove if you need multiple replicas or orchestration
    container_name: ${COMPOSE_PROJECT_NAME:-mata-dashboard}-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3300}:80"
    volumes:
      - ./config:/var/www/html/config
      - ./logs:/var/www/html/logs
      - ./temp:/var/www/html/temp
    env_file:
      - ./config/config.env
      - ./config/db.config.env
      - ./config/mail.config.env
    environment:
      # Override only Docker-specific infrastructure settings
      # Application settings come from config/*.env files
      - DB_HOST=mata-db
    depends_on:
      mata-db:
        condition: service_started
      mata-opa:
        condition: service_started
    networks:
      - mata-network
  mata-db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-mata}-mysql
    restart: unless-stopped
    env_file:
      - ./config/db.config.env
    environment:
      # MySQL container initialization (uses DB_* variables from db.config.env)
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me}
      MYSQL_DATABASE: ${DB_DATABASE:-mata_dashboard}
      MYSQL_USER: ${DB_USERNAME:-mata_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    networks:
      - mata-network

  mata-opa:
    image: openpolicyagent/opa:latest
    container_name: ${COMPOSE_PROJECT_NAME:-mata}-opa
    restart: unless-stopped
    command: ["run", "--server", "--addr", "0.0.0.0:3320", "--watch", "/policies"]
    volumes:
      - ./policy:/policies:ro
    ports:
      - "${OPA_PORT:-3320}:3320"
    networks:
      - mata-network

volumes:
  mysql_data:
    driver: local

networks:
  mata-network:
    name: mata-network
    external: true
