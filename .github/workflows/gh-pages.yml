name: Deploy Docs
on:
  push:
    branches: [ main ]
    paths: [ 'mkdocs.yml', 'docs/**', 'scripts/docs/**', 'docker/cron/crontab' ]
  workflow_dispatch:
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.x' }
      - run: pipx install mkdocs
      - run: pipx inject mkdocs mkdocs-shadcn mkdocs-llmstxt
      - run: scripts/docs/sync-node-docs.sh
      - run: mkdocs gh-deploy --force
