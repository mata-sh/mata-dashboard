name: Deploy Docs
on:
  push:
    branches: [ main ]
    paths: [ 'mkdocs.yml', 'docs/**', 'scripts/docs/**' ]
  workflow_dispatch:
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - run: pipx install mkdocs
      - run: pipx inject mkdocs mkdocs-shadcn
      - run: scripts/docs/sync-node-docs.sh
      - run: mkdocs gh-deploy --force
