name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write # create the release and upload its assets
      id-token: write # OIDC token for Sigstore keyless signing and provenance
      attestations: write # store the provenance in GitHub's attestation API

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies (from lockfile)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Ensure composer.lock is up to date
        run: git diff --exit-code composer.lock

      - name: Dependency security audit
        run: composer audit

      - name: Code style (PHP-CS-Fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Static analysis (PHPStan, level 7)
        run: vendor/bin/phpstan analyse --level=7

      - name: Static analysis of entrypoints (PHPStan, level 7)
        run: composer stan-entrypoints

      - name: Unit tests (PHPUnit)
        run: vendor/bin/phpunit

      - name: Generate SBOM (CycloneDX)
        run: |
          composer CycloneDX:make-sbom \
            --output-format JSON \
            --output-file sbom.cdx.json \
            --omit dev

      # mata.sh/install.sh redirects to releases/latest/download/install.sh.
      - name: Pin the installer to this release
        run: |
          sed "s/^MATA_VERSION_DEFAULT=\$/MATA_VERSION_DEFAULT=${GITHUB_REF_NAME}/" scripts/install.sh > install.sh
          grep -qx "MATA_VERSION_DEFAULT=${GITHUB_REF_NAME}" install.sh

      - name: Generate checksums
        run: |
          sha256sum sbom.cdx.json install.sh > checksums.txt

      # SLSA v1.0 build provenance: which repository, commit, workflow and runner
      # produced the assets. Stored by GitHub (gh attestation verify) and attached
      # to the release as provenance.sigstore.json. See docs/architecture/security.md.
      - name: Attest build provenance (SLSA)
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            sbom.cdx.json
            install.sh
            checksums.txt

      - name: Attach the provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" provenance.sigstore.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      # Keyless: the job's OIDC token gets a short-lived Fulcio certificate whose
      # identity is this workflow at this tag; the signature is logged in Rekor.
      - name: Sign release assets (Sigstore)
        run: |
          for file in sbom.cdx.json install.sh checksums.txt; do
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "${file}"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            sbom.cdx.json
            sbom.cdx.json.sigstore.json
            install.sh
            install.sh.sigstore.json
            checksums.txt
            checksums.txt.sigstore.json
            provenance.sigstore.json
