name: CI

on:
  pull_request:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  node-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies (from lockfile)
        run: npm ci

      - name: Dependency security audit
        run: npm audit

      - name: Build Bulma
        run: npm run build-bulma

  docs-ci:
    name: Docs CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install MkDocs
        run: |
          pipx install mkdocs
          pipx inject mkdocs mkdocs-shadcn mkdocs-llmstxt

      - name: Sync MATA Node docs
        run: scripts/docs/sync-node-docs.sh

      - name: Build docs
        run: mkdocs build --strict

  php-ci:
    name: PHP CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install OPA
        run: |
          OPA_VERSION=1.12.2
          OPA_SHA256=a4ba8734ed95ceaac850c12684a42467ed6b0dc9633a9db8dd14d47d05e37751
          curl -fsSLo opa "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA256}  opa" | sha256sum --check -
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: Config policy checks
        run: make opa-validate

      - name: Policy tests (OPA)
        run: opa test policy

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies (from lockfile)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Ensure composer.lock is up to date
        run: git diff --exit-code composer.lock

      - name: Dependency security audit
        run: composer audit

      - name: Code style (PHP-CS-Fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Static analysis (PHPStan, level 7)
        run: vendor/bin/phpstan analyse --level=7

      - name: Static analysis of entrypoints (PHPStan, level 7)
        run: composer stan-entrypoints

      - name: Unit tests (PHPUnit)
        run: vendor/bin/phpunit
