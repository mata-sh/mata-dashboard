name: CI

on:
  pull_request:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  php-ci:
    name: PHP CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OPA
        run: |
          OPA_VERSION=1.12.2
          curl -sSL -o opa https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: Config policy checks
        run: make opa-validate

      - name: Policy tests (OPA)
        run: opa test policy

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies (from lockfile)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Ensure composer.lock is up to date
        run: git diff --exit-code composer.lock

      - name: Dependency security audit
        run: composer audit

      - name: Code style (PHP-CS-Fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Static analysis (PHPStan, level 5)
        run: vendor/bin/phpstan analyse --level=5

      - name: Unit tests (PHPUnit)
        run: vendor/bin/phpunit
