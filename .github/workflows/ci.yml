name: CI

on:
  pull_request:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  docs-ci:
    name: Docs CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs
        run: |
          pipx install mkdocs
          pipx inject mkdocs mkdocs-shadcn

      - name: Build docs
        run: mkdocs build --strict

  php-ci:
    name: PHP CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OPA
        run: |
          OPA_VERSION=1.12.2
          OPA_SHA256=a4ba8734ed95ceaac850c12684a42467ed6b0dc9633a9db8dd14d47d05e37751
          curl -fsSLo opa "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA256}  opa" | sha256sum --check -
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: Config policy checks
        run: make opa-validate

      - name: Policy tests (OPA)
        run: opa test policy

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies (from lockfile)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Ensure composer.lock is up to date
        run: git diff --exit-code composer.lock

      - name: Dependency security audit
        run: composer audit

      - name: Code style (PHP-CS-Fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Static analysis (PHPStan, level 5)
        run: vendor/bin/phpstan analyse --level=5

      - name: Unit tests (PHPUnit)
        run: vendor/bin/phpunit
