version: 2

updates:
  - package-ecosystem: "composer"
    directory: "/"

    # Keep noise low
    schedule:
      interval: "monthly"

    # Only one open PR at a time
    open-pull-requests-limit: 1

    # Clear labeling
    labels:
      - "dependencies"

    # Conservative commit messages
    commit-message:
      prefix: "deps"

    # Reduce churn: ignore non-security minor/major bumps
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: "monthly"

    labels:
      - "dependencies"

    commit-message:
      prefix: "ci"

    # Workflows pin actions to commit SHAs; Dependabot bumps the SHA and the
    # version comment together. Only major bumps (e.g. Node runtime moves),
    # all actions in one PR. Security updates bypass this ignore rule.
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
